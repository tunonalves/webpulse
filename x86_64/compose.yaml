services:
  latecla:
    build: .
    image: web-load-test-playwright:1.4
    container_name: web-load-test-latecla
    profiles: ["latecla"]
    restart: unless-stopped
    shm_size: ${WORKER_SHM_SIZE:-256m}
    cpus: ${WORKER_CPU_LIMIT:-1.25}
    mem_limit: ${WORKER_MEMORY_LIMIT:-1200m}
    environment:
      PORTAL_CONFIG: /app/config.yaml
      USERS: ${LATECLA_USERS:-1}
      LOG_DIR: /app/logs
      REPORT_DIR: /app/reports
    volumes:
      - ./configs/latecla.yaml:/app/config.yaml:ro
      - ./logs/latecla:/app/logs
      - ./reports/latecla:/app/reports
